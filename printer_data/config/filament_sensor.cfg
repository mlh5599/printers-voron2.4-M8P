[filament_switch_sensor filament_sensor]
switch_pin: ^PF0
pause_on_runout: True
runout_gcode: _FILAMENT_RUNOUT

# Re-enabled 2026-08-10: was disabled 2026-08-07 for false-triggering
# during active extrusion even after raising detection_length 7.0 -> 10.0
# (root cause was never found). FILAMENT_MOTION_SUSPEND/RESUME below give
# a manual escape hatch if it starts misfiring again.
[filament_motion_sensor filament_motion_sensor]
switch_pin: ^PF1
detection_length: 10.0
extruder: extruder
pause_on_runout: True
runout_gcode: _FILAMENT_RUNOUT

# On runout, pause_on_runout above already triggers a single PAUSE (which
# parks the toolhead away from the print via mainsail.cfg's
# _TOOLHEAD_PARK_PAUSE_CANCEL, and stashes the current extruder target in
# RESUME's last_extruder_temp for later restore). This macro runs right
# after that PAUSE: it cools the hotend so it is not sitting hot next to
# the part, but deliberately leaves heater_bed alone so the bed stays hot.
# Setting RESUME's idle_state forces RESUME to take its "reheat before
# resuming" branch (blocking M109 back to last_extruder_temp) instead of
# just checking whether the (now-cold) extruder is already hot enough.
#
# It also extends idle_timeout to 6 hours so Klipper's own idle safety
# shutoff (which would otherwise TURN_OFF_HEATERS, including the bed,
# after the default 10 minutes) does not kill the bed heater while the
# runout sits unattended. The pre-runout timeout is stashed into RESUME's
# restore_idle_timeout, which RESUME/CANCEL_PRINT already restore
# automatically once the print resumes or is cancelled. Only this
# runout path extends the timeout - a manual pause or M600 still gets
# the normal 10-minute default from mainsail.cfg's PAUSE macro.
[gcode_macro _FILAMENT_RUNOUT]
description: Helper - cool the hotend after a runout pause, keep the bed hot for up to 6 hours
gcode:
    {% if printer.toolhead.extruder != "" %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
    SET_IDLE_TIMEOUT TIMEOUT=21600

# Tells mainsail.cfg's RESUME macro to refuse to resume if this sensor
# still reports no filament. mainsail.cfg itself is a symlink into the
# upstream mainsail-config repo, so this override lives here instead.
[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor: "filament_switch_sensor filament_sensor"
gcode:

# Manual suspend/resume of runout detection, e.g. for the deliberate gap
# between the old spool running dry and the next spool being fed in by
# hand. SET_FILAMENT_SENSOR ENABLE=0/1 is a stock Klipper command from
# filament_switch_sensor itself - these macros just wrap it with status
# feedback and a safety-net auto re-enable so a forgotten RUNOUT_RESUME
# doesn't leave the rest of the print unprotected.
[gcode_macro RUNOUT_SUSPEND]
description: Temporarily disable filament runout detection (e.g. for a manual spool change); auto re-enables after 10 min if not resumed
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    UPDATE_DELAYED_GCODE ID=_runout_resume_timer DURATION=600
    RESPOND TYPE=echo MSG="Runout sensor suspended - auto re-enabling in 10 min"

[gcode_macro RUNOUT_RESUME]
description: Re-enable filament runout detection immediately
gcode:
    UPDATE_DELAYED_GCODE ID=_runout_resume_timer DURATION=0
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    RESPOND TYPE=echo MSG="Runout sensor re-enabled"

[delayed_gcode _runout_resume_timer]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    RESPOND TYPE=echo MSG="Runout sensor auto re-enabled after timeout"

# Manual suspend/resume of motion detection. Unlike RUNOUT_SUSPEND above,
# this has NO auto re-enable timer: the motion sensor was disabled in the
# first place for recurring false triggers during normal extrusion, so an
# unattended auto re-enable would just reintroduce that problem mid-print.
# FILAMENT_MOTION_RESUME must be run manually to turn detection back on.
[gcode_macro FILAMENT_MOTION_SUSPEND]
description: Temporarily disable filament motion detection (no auto re-enable - must be resumed manually)
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_motion_sensor ENABLE=0
    RESPOND TYPE=echo MSG="Motion sensor suspended - remember to run FILAMENT_MOTION_RESUME"

[gcode_macro FILAMENT_MOTION_RESUME]
description: Re-enable filament motion detection immediately
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_motion_sensor ENABLE=1
    RESPOND TYPE=echo MSG="Motion sensor re-enabled"
