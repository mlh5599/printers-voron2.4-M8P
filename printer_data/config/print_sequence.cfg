#####################################################################
# 	Print Start / End / Leveling Sequence
#####################################################################

#Quad Gantry Level
[gcode_macro G32]
gcode:
    {% set UNDOCK_PROBE = params.UNDOCK|default(1)|int %}

    BED_MESH_CLEAR

    {% if "xyz" not in printer.toolhead.homed_axes %}

      _status_homing
      M117 Homing...
      G28 PROBE_LOCK=1

    {% endif %}

    _status_leveling

    M117 Leveling...
    Attach_Probe_Lock
    QUAD_GANTRY_LEVEL

    {% if UNDOCK_PROBE %}
        Dock_Probe_Unlock
    {% else %}
        RESPOND PREFIX=info MSG="G32 complete – probe left attached"
    {% endif %}

    _status_ready

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% if V %}
        { action_respond_info("QG Level") }
    {% endif %}

    _CheckProbe action=query
    G90
    Attach_Probe

    _klicky_status_leveling
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    # If QGL has not been done yet, correct for any major skew first
    # at 8mm height
    {% if not printer.quad_gantry_level.applied %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=8 retry_tolerance=1
    {% endif %}
    # Complete with a full QGL at the configured height
    _QUAD_GANTRY_LEVEL
    RESTORE_GCODE_STATE NAME=STATE_QGL

    Dock_Probe

[gcode_macro _PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:

    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|float %}
    {% set CURR_BED_TYPE = params.CURR_BED_TYPE|default("None") %}

    {% set SOAK_TIME = 0 %}
    {% if BED_TEMP|int > 90 %}
      {% set SOAK_TIME = params.SOAK_TIME|default(0)|float %}
      SET_FAN_SPEED FAN=nevermore SPEED=1
    {% endif %}

    #Get a head start on bed heating
    _status_heating
    M117 Heating bed to {BED_TEMP}°
    M140 S{BED_TEMP}

    #BRUSH_PARK

    M117 "Waiting for chamber temperature of {CHAMBER_TEMP}°
    #Wait for chamber temp
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={CHAMBER_TEMP}
    #Let's heat soak
    _status_heating

    M117 "Waiting for bed temperature of {BED_TEMP}°"
    M190 S{BED_TEMP}  ; Wait for bed temp before soaking

    {% set soak_minutes = SOAK_TIME|int %}
    {% for minute in range(soak_minutes, 0, -1) %}
      M117 Heat soaking, { minute } mins left
      G4 P60000  ; Wait 1 minute
    {% endfor %}

    M117 Heating extruder...
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}

    G32 UNDOCK=0

    #Mesh
    _status_meshing
    M117 Meshing...
    BED_MESH_CALIBRATE ADAPTIVE=1

    Dock_Probe_Unlock

    #Set runtime offsets per build plate type
    _SET_RUNTIME_Z_OFFSET CURR_BED_TYPE="{CURR_BED_TYPE}"

    SMART_PARK

    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP}

    LINE_PURGE

    M117 Printing...
    _status_printing

[gcode_macro _SET_RUNTIME_Z_OFFSET]
gcode:
  {% set CURR_BED_TYPE = params.CURR_BED_TYPE|default("None") %}
  {% set offset_data = printer["gcode_macro _bed_offsets"] %}

  {% if CURR_BED_TYPE == "Textured PEI Plate" %}
    SET_GCODE_OFFSET Z=-0.032
    M117 Using Textured PEI Offset
  {% elif CURR_BED_TYPE == "Smooth PEI Plate" %}
    SET_GCODE_OFFSET Z=0
    M117 Using Smooth PEI Offset
  {% else %}
    SET_GCODE_OFFSET Z=0
    M117 Using Default Offset
  {% endif %}

[gcode_macro _PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SET_GCODE_OFFSET Z=0

#    SET_VELOCITY_LIMIT \
#    VELOCITY={printer["gcode_macro _MOTION_DEFAULTS"].velocity} \
#    ACCEL={printer["gcode_macro _MOTION_DEFAULTS"].accel} \
#    ACCEL_TO_DECEL={printer["gcode_macro _MOTION_DEFAULTS"].accel_to_decel} \
#    SQUARE_CORNER_VELOCITY={printer["gcode_macro _MOTION_DEFAULTS"].scv}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M117 Print Complete
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=nevermore SPEED=0
    M107                           ; turn off fan
    G0 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0 X350 Y350 F20000

    #PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    BED_MESH_CLEAR

    #TURN_OFF_HEATERS               ; kill the heaters

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
#    SET_FAN_SPEED fan=controller_fan speed=0
    M84
    _status_off
