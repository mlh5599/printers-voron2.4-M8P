
[delayed_gcode _MOTION_LIGHTS_STARTUP_ARM]
initial_duration: 2
gcode:
  _status_ready
  # If nobody moved yet, start the countdown so lights can shut off
  UPDATE_DELAYED_GCODE ID=lights_off_timeout DURATION=300
  
[gcode_macro _MOTION_LIGHT_STATE]
variable_is_on: 1        # lights start on after boot
variable_timed_out: 0    # no timeout has happened yet
gcode:
  ; state holder only

[gcode_button motion_sensor]
pin: PC15
press_gcode:
  # If lights are off, we are turning them on now
  {% if printer["gcode_macro _MOTION_LIGHT_STATE"].is_on|int == 0 %}
    SET_GCODE_VARIABLE MACRO=_MOTION_LIGHT_STATE VARIABLE=is_on VALUE=1
    LIGHTS_ON

    # Only restore SB LEDs if they were turned off by our timeout
    {% if printer["gcode_macro _MOTION_LIGHT_STATE"].timed_out|int == 1 %}
      _SB_LED_RESTORE_BY_NAME leds="nozzle"
      SET_GCODE_VARIABLE MACRO=_MOTION_LIGHT_STATE VARIABLE=timed_out VALUE=0
    {% endif %}
  {% endif %}

  # Any motion cancels pending shutoff
  UPDATE_DELAYED_GCODE ID=lights_off_timeout DURATION=0

release_gcode:
  UPDATE_DELAYED_GCODE ID=lights_off_timeout DURATION=300

debounce_delay: 0.1


[delayed_gcode lights_off_timeout]
gcode:
  LIGHTS_OFF
  _set_nozzle_leds red=0 green=0 blue=0 white=0
  SET_GCODE_VARIABLE MACRO=_MOTION_LIGHT_STATE VARIABLE=is_on VALUE=0
  SET_GCODE_VARIABLE MACRO=_MOTION_LIGHT_STATE VARIABLE=timed_out VALUE=1
[gcode_macro LIGHTS_ON]
gcode:
  SET_PIN PIN=caselight VALUE=1.00

[gcode_macro LIGHTS_OFF]
gcode:
  SET_PIN PIN=caselight VALUE=0
