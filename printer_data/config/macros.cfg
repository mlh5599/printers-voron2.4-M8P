#####################################################################
# 	Misc Macros
#####################################################################

[gcode_macro CENTER_ALL]
gcode:
    G90             ; Use absolute positioning
    G1 X175 Y175 Z175 F18000  ; Move to 175,175,175 at a feedrate of 6000 mm/min

[gcode_macro BELT_TUNING_POSITION]
description: Position toolhead for X/Y belt tuning (X center, 100mm from front gantry corner, Z=150)
gcode:
    G90
    G1 Z150 X175 Y110.5 F3000

    RESPOND PREFIX=info MSG="Toolhead positioned for X/Y belt tuning (X=175, Y=90, Z=150)"

[delayed_gcode POWER_OFF_TIMER]
gcode:
    {% set hotend_temp = printer["extruder"].temperature %}
    {% set hotend_target = printer["extruder"].target %}
    {% set bed_target = printer["heater_bed"].target %}

    {% if hotend_target > 0 or bed_target > 0 %}
        RESPOND PREFIX="AUTO_OFF" MSG="Power-off canceled: heater active (hotend_target={hotend_target}, bed_target={bed_target})"
    {% elif hotend_temp > 50 %}
        RESPOND PREFIX="AUTO_OFF" MSG="Hotend still too hot ({hotend_temp}°C), waiting 60s before retry"
        UPDATE_DELAYED_GCODE ID=POWER_OFF_TIMER DURATION=60
    {% else %}
        RESPOND PREFIX="AUTO_OFF" MSG="Conditions met — powering off"
        {% if "output_pin power_relay" in printer %}
        SET_PIN PIN=power_relay VALUE=0
        {% endif %}
        {action_call_remote_method("shutdown_machine")}   ; Moonraker compatible host shutdown
    {% endif %}

[gcode_macro START_POWER_OFF_TIMER]
gcode:
    RESPOND PREFIX="AUTO_OFF" MSG="Starting power-off countdown"
    UPDATE_DELAYED_GCODE ID=POWER_OFF_TIMER DURATION=60
